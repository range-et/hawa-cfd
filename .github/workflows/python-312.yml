# Python 3.12 developer environment (.venv-dev). Production stays Python 3.9:
# the 3.9 jobs in the other workflows remain authoritative.
name: Python 3.12 dev environment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One run per PR or branch. A new push to a PR cancels its older run.
  # On main the in-flight run finishes and queued runs collapse to the newest merge.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  py39-guards:
    name: Python 3.9 syntax guard and Rhino requirements export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
      - name: Install the tools dependency group
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install --group tools
      - name: Reject syntax that Python 3.9 cannot parse
        run: ruff check --output-format=github .
      - name: Require requirements/rhino-py39.txt to match uv.lock for Python 3.9
        run: |
          bash scripts/export_rhino_requirements.sh
          git diff --exit-code requirements/rhino-py39.txt

  tests:
    name: Full headless suite on Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install .venv-dev
        run: |
          python -m venv .venv-dev
          .venv-dev/bin/python -m pip install --upgrade pip==25.3
          .venv-dev/bin/python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu --no-deps
          .venv-dev/bin/python -m pip install -e vendor/lettuce -e '.[test]' --group tools
      - name: Run the full headless suite
        run: .venv-dev/bin/python -m pytest tests -q
