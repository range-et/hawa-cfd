[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hawa-cfd"
version = "0.5.0"
description = "Embedded Python 3.9 LBM engine and Grasshopper plugin"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9,<3.10"
dependencies = ["torch==2.8.0", "numpy==2.0.2", "hawa-lettuce==0.3.0.post1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "psutil==7.2.2", "scipy==1.13.1", "coverage==7.10.7"]

[tool.uv.sources]
hawa-lettuce = { path = "vendor/lettuce", editable = true }

[project.scripts]
hawa = "hawa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
